<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#050505"/>
  <!-- внешнее кольцо делений -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#ffd25f" stroke-width="5" stroke-dasharray="10 21" opacity="0.75"/>
  <!-- линия горизонта -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5 11" opacity="0.28"/>
  <!-- траектория солнца: от восхода через полдень к закату -->
  <path d="M 106 256 A 150 150 0 0 1 156 145" fill="none" stroke="#ff6b35" stroke-width="13" stroke-linecap="round"/>
  <path d="M 156 145 A 150 150 0 0 1 226 108" fill="none" stroke="#ffd25f" stroke-width="13" stroke-linecap="round"/>
  <path d="M 226 108 A 150 150 0 0 1 356 145" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.45"/>
  <path d="M 356 145 A 150 150 0 0 1 406 256" fill="none" stroke="#4d7fd6" stroke-width="13" stroke-linecap="round"/>
  <!-- солнце «сейчас» -->
  <circle cx="226" cy="108" r="26" fill="#ffd25f"/>
  <!-- центр прибора -->
  <circle cx="256" cy="256" r="9" fill="#ffffff"/>
  <!-- визирная риска на север -->
  <line x1="256" y1="26" x2="256" y2="62" stroke="#ffd25f" stroke-width="7" stroke-linecap="round"/>
</svg>
